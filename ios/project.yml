# XcodeGen 工程描述：https://github.com/yonaskolb/XcodeGen
# 用 `xcodegen generate` 生成 Winterfall.xcodeproj（.xcodeproj 不入库，避免手写 pbxproj）
name: Winterfall

options:
  bundleIdPrefix: com.fundus
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    # 这个包是给第三方签名服务（全能签等）重新签名的，构建阶段一律不签名
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Winterfall:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # Info.plist 由 INFOPLIST_FILE 处理；若同时进资源阶段，
          # Xcode 会因产物重名（Multiple commands produce Info.plist）而编译失败
          - Info.plist
      # 内置站点：构建前由 workflow 从仓库复制进 ios/www（不入库），
      # 作为文件夹引用原样打进 App bundle —— 首次运行复制到沙盒，实现断网可玩。
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fundus.winterfall
        PRODUCT_NAME: Winterfall
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        SUPPORTS_MACCATALYST: "NO"

schemes:
  Winterfall:
    build:
      targets:
        Winterfall: all
    run:
      config: Release
    archive:
      config: Release
