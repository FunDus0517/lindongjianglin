name: iOS 未签名 IPA

# 只在 iOS 工程本身变动时编译。
# 网页内容改了不需要重新出包 —— App 打开时直接读服务器，改完即生效。
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: 编译未签名 IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 把站点内容打进 App（离线可玩的基础）
        run: |
          rm -rf ios/www
          mkdir -p ios/www
          cp index.html manifest.webmanifest icon.svg icon-512.png apple-touch-icon.png version.json ios/www/
          cp -R src ios/www/src
          if [ -d assets ]; then cp -R assets ios/www/assets; fi
          echo "bundled files: $(find ios/www -type f | wc -l)"

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Winterfall.xcodeproj \
            -scheme Winterfall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/Winterfall.app"
          if [ ! -d "$APP" ]; then echo "编译产物不存在: $APP"; exit 1; fi
          echo "Bundle ID : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "显示名称  : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")"
          rm -rf Payload Winterfall.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Winterfall.ipa Payload
          ls -lh Winterfall.ipa
          unzip -l Winterfall.ipa | head -20

      - name: 上传构建产物（需登录 GitHub 才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: Winterfall-unsigned-ipa
          path: ios/Winterfall.ipa
          if-no-files-found: error

      # 把 IPA 推到一个独立分支：本机脚本用 git 就能取回来，再发布到下载站
      # （不走 Releases：私有仓库的 Release 链接用户点不开）
      - name: 把 IPA 推到 ipa 分支（供下载站发布脚本取回）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/ipaout && mkdir -p /tmp/ipaout
          cd /tmp/ipaout
          git init -q
          git checkout -q -b ipa
          cp "$GITHUB_WORKSPACE/ios/Winterfall.ipa" Winterfall.ipa
          echo "$GITHUB_SHA" > BUILD.txt
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "ipa $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ipa
          echo "已推送到 ipa 分支"
          ls -lh Winterfall.ipa

      - name: 发布到 Releases（备用；私有仓库需登录才能下）
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios
        run: |
          gh release delete latest-ipa --yes --cleanup-tag || true
          gh release create latest-ipa Winterfall.ipa --title "未签名 IPA（最新构建）" --notes "未签名 IPA。App 内容从服务器云端加载，改游戏内容不需要重新出包。" || true
