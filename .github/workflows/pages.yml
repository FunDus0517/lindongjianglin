name: deploy-pages

# 把纯静态游戏发布到 GitHub Pages。
# 产物就是仓库里的 index.html / src / manifest.webmanifest / icon.svg —— 没有构建步骤，
# 所以这里直接把整个仓库作为静态站点上传（排除测试与工具目录）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点目录（只放运行时需要的文件）
        run: |
          mkdir -p site
          cp -r index.html manifest.webmanifest icon.svg src site/
          test -f site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
